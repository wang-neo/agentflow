# Slack 集成配置
# 真实发送：环境变量 SLACK_WEBHOOK_URL（Incoming Webhook URL）
# 未设置时自动降级为占位模式（聊天输出 + docs/slack-log.md 留痕），流程不中断。

slack:
  # 默认频道（webhook 本身绑定了频道时此值仅用于留痕记录）
  default_channel: "#katana-review"

  # webhook 地址不入库（secret），从环境变量读：
  #   export SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T000/B000/XXXX
  # 协调者启动时检查该变量：有 → 真发送；无 → 占位并在就绪简报中提示。

  # 消息模板（{var} 占位符由协调者填充）
  templates:
    pr_created: |
      🔔 新 PR 待审核：{pr_url}
      需求：{requirement_summary}
      方案：{plan_summary}
      {mention_on_pr_created} 请 review 并留 comment；approve 后由 {owner} 手动 merge。
    updated: |
      {mention_on_update} updated: {changes_summary}（PR：{pr_url}）
    no_comment: |
      {mention_no_comment_list} PR {pr_url} 已 {hours}h 无 review comment，需要重新审核
    approved: |
      ✅ {pr_url} 已 approve，{mention_on_approved} 请手动 merge
    s4_approval: |
      📝 方案待审批（{task_id}）：{plan_summary}
      产物：{artifacts_paths}
      请在 Orca 会话中回复「通过」/「打回：意见」

  # 发送纪律
  rules:
    - 每条消息发送前先写 docs/slack-log.md（时间/模板名/内容/结果）——留痕优先，发送失败不丢记录
    - webhook 失败重试 1 次，仍失败降级占位并在聊天里警告
    - 同一事件（同 PR 同类型）5 分钟内不重发（防抖）
